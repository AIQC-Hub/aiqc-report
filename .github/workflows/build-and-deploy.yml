name: Build and Deploy Quarto Site

# Run this workflow on pushes to the main branch
on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN permissions to deploy to GitHub Pages
permissions:
  contents: read    # To checkout the repo and read release assets
  pages: write      # To deploy to Pages
  id-token: write   # To authenticate with OIDC

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the R environment
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      # 3. Cache and install R package dependencies
      # This action reads DESCRIPTION, so there is no second list to keep in
      # step here: everything but rmarkdown comes from reportlib. reportlib is
      # pinned by tag so a change there cannot silently alter a published site.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::rmarkdown
            github::AIQC-Hub/reportlib@v0.1.11

      # 4. Set up Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 5. Build the site
      - name: Build site
        run: quarto render content

      # 6. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 7. Upload the built site as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match `project: output-dir` in content/_quarto.yml
          path: './content/docs'

      # 8. Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
